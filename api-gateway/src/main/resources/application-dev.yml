server:
  port: 8888

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8080
              predicates:
                - Path=/user/api/**

            - id: channel-service
              uri: http://localhost:8081
              predicates:
                - Path=/channel/api/**

            - id: stream-service
              uri: http://localhost:8082
              predicates:
                - Path=/stream/api/**

            - id: payment-service
              uri: http://localhost:8083
              predicates:
                - Path=/payment/api/**

            - id: vod-service
              uri: http://localhost:8084
              predicates:
                - Path=/vod/api/**

            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/notification/api/**

gateway:
  security:
    signer-key: ${JWT_SIGNER_KEY}
    issuer: reallive.com
    csrf-enabled: false
    blacklist-timeout: ${REDIS_TIMEOUT:2s}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
    access-cookie:
      name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}
      path: ${ACCESS_TOKEN_PATH:/}
      secure: ${ACCESS_TOKEN_SECURE:false}
      http-only: ${ACCESS_TOKEN_HTTP_ONLY:true}
      same-site: ${ACCESS_TOKEN_SAME_SITE:Lax}
    refresh-cookie:
      name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
      path: ${REFRESH_TOKEN_PATH:/user/api/auth}
      secure: ${REFRESH_TOKEN_SECURE:false}
      http-only: ${REFRESH_TOKEN_HTTP_ONLY:true}
      same-site: ${REFRESH_TOKEN_SAME_SITE:Lax}

management:
  endpoints:
    web:
      exposure:
        include: health
