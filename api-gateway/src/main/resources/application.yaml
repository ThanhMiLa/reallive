server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8080
          predicates:
            - Path=/user/**

        - id: channel-service
          uri: http://localhost:8081
          predicates:
            - Path=/channel/**

        - id: stream-service
          uri: http://localhost:8082
          predicates:
            - Path=/stream/**

        - id: payment-service
          uri: http://localhost:8083
          predicates:
            - Path=/payment/**

        - id: vod-service
          uri: http://localhost:8084
          predicates:
            - Path=/vod/**

        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/notification/**
