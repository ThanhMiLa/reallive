name: Media Worker tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test media-worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    defaults:
      run:
        working-directory: media-worker

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: media-worker/package-lock.json
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:cov
      - name: Run HTTP contract tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
      - name: Run integration tests
        run: npm run test:integration -- --runInBand
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-coverage-media-worker
          path: media-worker/coverage/
          if-no-files-found: warn
          retention-days: 7
