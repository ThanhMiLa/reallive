name: Chat Service tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test chat-service
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: chat-service

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:cov -- --runInBand
      - name: Build
        run: npm run build
      - name: Run integration tests
        run: npm run test:integration
      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-coverage-chat-service
          path: chat-service/coverage/
          if-no-files-found: warn
          retention-days: 7
