name: reallive-streaming-fixture
# Run from root with --project-directory .
services:
  media-server:
    extends:
      file: docker-compose.yml
      service: media-server
    environment:
      MTX_AUTHJWTJWKS: http://host.docker.internal:18082/stream/internal/api/media/jwks
      MTX_HLSALLOWORIGINS: http://localhost:18082,http://localhost:5173
      STREAM_MEDIA_CALLBACK_URL: http://host.docker.internal:18082/stream/internal/api/media-events
      # Fixture owns its paths explicitly and has no channel database to restore.
      STREAM_MEDIA_STARTUP_CALLBACK_URL: ""
