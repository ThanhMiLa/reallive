name: reallive-streaming-fixture
# Run from root with --project-directory .
services:
  media-server:
    extends:
      file: docker-compose.yml
      service: media-server
    environment:
      MTX_AUTHJWTJWKS: http://host.docker.internal:18082/stream/api/media/jwks
      MTX_HLSALLOWORIGINS: http://localhost:18082,http://localhost:5173
      STREAM_MEDIA_CALLBACK_URL: http://host.docker.internal:18082/stream/internal/api/media-events
      STREAM_MEDIA_CALLBACK_INTERNAL_TOKEN: ${STREAM_MEDIA_CALLBACK_INTERNAL_TOKEN:-fixture-only-internal-callback-token}
