server:
  port: 8081
  servlet:
    context-path: /channel

spring:
  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 5000

  application:
    name: channel

  datasource:
    url: ${CHANNEL_DB_URL:jdbc:postgresql://localhost:5433/reallive_channel}
    username: ${CHANNEL_DB_USERNAME:channel_service}
    password: ${CHANNEL_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration


auth:
  cookie:
    access-token:
      name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}

app:
  service:
    user: ${USER_SERVICE_BASE_URL:http://localhost:8080/user}
