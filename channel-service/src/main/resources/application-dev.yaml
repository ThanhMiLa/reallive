server:
  address: ${BACKEND_BIND_ADDRESS:127.0.0.1}
  port: 8081
  servlet:
    context-path: /channel

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 5MB

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 5000

  application:
    name: channel-service

  datasource:
    url: ${CHANNEL_DB_URL:jdbc:postgresql://localhost:5433/reallive_channel}
    username: ${CHANNEL_DB_USERNAME:channel_service}
    password: ${CHANNEL_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration


auth:
  cookie:
    access-token:
      name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}

app:
  service:
    user: ${USER_SERVICE_BASE_URL:http://localhost:8080/user}

storage:
  r2:
    bucket-name: ${BUCKET_NAME}
    public-base-url: ${PUBLIC_BASE_URL}
    endpoint: ${R2_ENDPOINT}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}

