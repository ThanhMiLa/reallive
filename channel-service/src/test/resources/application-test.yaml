spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: jdbc:h2:mem:channel_context;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

auth:
  cookie:
    access-token:
      name: access_token

app:
  service:
    user: http://127.0.0.1:1/user

storage:
  r2:
    bucket-name: test-channel-banners
    public-base-url: https://images.example.com
    endpoint: https://r2.example.invalid
    access-key-id: test-access-key
    secret-access-key: test-secret-key
