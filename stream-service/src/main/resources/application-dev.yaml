server:
  address: ${BACKEND_BIND_ADDRESS:127.0.0.1}
  port: ${STREAM_SERVICE_PORT:8082}
  servlet:
    context-path: /stream

spring:
  application:
    name: stream-service

  datasource:
    url: ${STREAM_DB_URL:jdbc:postgresql://localhost:5434/reallive_stream}
    username: ${STREAM_DB_USERNAME:stream_service}
    password: ${STREAM_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: stream-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
        max.block.ms: 5000
        retry.backoff.ms: 500

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 2000
            readTimeout: 5000
          channel-service:
            connectTimeout: 2000
            readTimeout: 5000

auth:
  cookie:
    access-token:
      name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}

app:
  service:
    user: ${USER_SERVICE_BASE_URL:http://localhost:8080/user}
    channel: ${CHANNEL_SERVICE_BASE_URL:http://localhost:8081/channel}

stream:
  media:
    private-key-base64: ${STREAM_MEDIA_PRIVATE_KEY_BASE64:}
    public-key-base64: ${STREAM_MEDIA_PUBLIC_KEY_BASE64:}
    key-id: ${STREAM_MEDIA_KEY_ID:stream-rs256-v1}
    issuer: ${STREAM_MEDIA_ISSUER:reallive-stream}
    audience: ${STREAM_MEDIA_AUDIENCE:reallive-media}
    publish-token-ttl: ${STREAM_PUBLISH_TOKEN_TTL:8h}
    read-token-ttl: ${STREAM_READ_TOKEN_TTL:5m}
    control-token-ttl: ${STREAM_CONTROL_TOKEN_TTL:5m}
    rtmp-public-url: ${STREAM_RTMP_PUBLIC_URL:rtmp://localhost:1935/live}
    hls-public-base-url: ${STREAM_HLS_PUBLIC_BASE_URL:http://localhost:8898}
    control-api:
      base-url: ${STREAM_MEDIA_CONTROL_API_URL:http://localhost:9997}
      connect-timeout: ${STREAM_MEDIA_CONTROL_CONNECT_TIMEOUT:2s}
      request-timeout: ${STREAM_MEDIA_CONTROL_REQUEST_TIMEOUT:5s}
  lifecycle:
    reconnect-grace: ${STREAM_RECONNECT_GRACE:60s}
