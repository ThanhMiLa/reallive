spring:
  application:
    name: stream-service-test

  datasource:
    url: jdbc:h2:mem:stream_context;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: false

auth:
  cookie:
    access-token:
      name: access_token
