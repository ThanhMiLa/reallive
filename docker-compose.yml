# Requires Docker Compose 2.23.1+ for inline MongoDB initialization.
# Copy .env.example to .env and media-worker/.env.example to media-worker/.env.
# Set passwords/internal tokens, then run: docker compose up -d --wait
# Media Server uses the direct Stream Service JWKS/callback; see media-server/README.md.
name: reallive

services:
  media-server:
    container_name: media-server
    image: reallive-media-server:1.21.2
    build:
      context: .
      dockerfile: media-server/docker/Dockerfile
    restart: unless-stopped
    environment:
      MTX_AUTHJWTJWKS: ${STREAM_MEDIA_JWKS_URL:?Set STREAM_MEDIA_JWKS_URL in .env}
      MTX_HLSALLOWORIGINS: ${STREAM_MEDIA_ALLOWED_ORIGINS:?Set STREAM_MEDIA_ALLOWED_ORIGINS in .env}
      STREAM_MEDIA_CALLBACK_URL: ${STREAM_MEDIA_CALLBACK_URL:?Set STREAM_MEDIA_CALLBACK_URL in .env}
      STREAM_CCU_ENABLED: ${STREAM_CCU_ENABLED:-false}
      MEDIA_CONTROL_BASE_URL: http://127.0.0.1:9997
      MEDIA_CONTROL_TOKEN_FILE: /run/media-hook/control.jwt
      STREAM_VIEWER_CALLBACK_URL: ${STREAM_VIEWER_CALLBACK_URL:-http://host.docker.internal:8082/stream/internal/api/viewer-events}
      STREAM_CCU_CALLBACK_TOKEN: ${STREAM_CCU_CALLBACK_TOKEN:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:1935:1935"
      - "127.0.0.1:8898:8888"
      - "127.0.0.1:9997:9997"
    volumes:
      - ./media-server/config/mediamtx.yml:/mediamtx.yml:ro
      - ${STREAM_CCU_CONTROL_TOKEN_DIRECTORY:-./.local/streaming/ccu}:/run/media-hook:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - 'import socket; [socket.create_connection(("127.0.0.1", port), timeout=2).close() for port in (1935, 8888, 9997)]'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  media-worker:
    container_name: media-worker
    image: reallive-media-worker:0.1.0
    build:
      context: ./media-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ./media-worker/.env
    environment:
      NODE_ENV: production
      PORT: "8090"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      MEDIA_WORKER_MEDIAMTX_BASE_URL: http://media-server:8888
      MEDIA_WORKER_TEMP_DIR: /var/lib/media-worker/tmp
      MEDIA_WORKER_FFMPEG_PATH: ffmpeg
      MEDIA_WORKER_FFPROBE_PATH: ffprobe
      MEDIA_WORKER_SHUTDOWN_TIMEOUT_MS: "45000"
      STREAM_SERVICE_BASE_URL: http://host.docker.internal:8082
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      redis:
        condition: service_healthy
      media-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:8090/health/ready").then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - default
      - data

  postgres-user:
    container_name: postgres-user
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: user_service
      POSTGRES_DB: reallive_user
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD:?Set USER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  postgres-channel:
    container_name: postgres-channel
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: channel_service
      POSTGRES_DB: reallive_channel
      POSTGRES_PASSWORD: ${CHANNEL_DB_PASSWORD:?Set CHANNEL_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-channel-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  postgres-stream:
    container_name: postgres-stream
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: stream_service
      POSTGRES_DB: reallive_stream
      POSTGRES_PASSWORD: ${STREAM_DB_PASSWORD:?Set STREAM_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-stream-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  postgres-payment:
    container_name: postgres-payment
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: payment_service
      POSTGRES_DB: reallive_payment
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  postgres-vod:
    container_name: postgres-vod
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: vod_service
      POSTGRES_DB: reallive_vod
      POSTGRES_PASSWORD: ${VOD_DB_PASSWORD:?Set VOD_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-vod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  postgres-notification:
    container_name: postgres-notification
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: notification_service
      POSTGRES_DB: reallive_notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - data

  mongodb-chat:
    container_name: mongodb-chat
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: reallive_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_ADMIN_PASSWORD:?Set MONGODB_ADMIN_PASSWORD in .env}
      MONGO_INITDB_DATABASE: reallive_chat
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
    entrypoint:
      - /bin/bash
      - -ec
      - |
        if [ ! -s /data/configdb/replica.key ]; then
          openssl rand -base64 756 > /data/configdb/replica.key
        fi
        chmod 400 /data/configdb/replica.key
        chown mongodb:mongodb /data/configdb/replica.key
        exec /usr/local/bin/docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/configdb/replica.key --bind_ip_all
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    configs:
      - source: mongodb-init
        target: /docker-entrypoint-initdb.d/01-create-chat-user.js
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host 127.0.0.1
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'let status; try { status = db.adminCommand({ replSetGetStatus: 1 }); } catch (e) { status = { ok: 0, code: e.code, codeName: e.codeName }; } if (status.ok !== 1) { if (status.code !== 94 && status.codeName !== "NotYetInitialized") quit(1); const init = rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "127.0.0.1:27017" }] }); if (init.ok !== 1) quit(1); } for (let i = 0; i < 10; i++) { if (db.hello().isWritablePrimary) quit(0); sleep(250); } quit(1);'
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - data

  kafka:
    container_name: kafka
    image: apache/kafka:4.2.1
    hostname: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:19092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - data

  redis:
    container_name: redis
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -ec
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --appendfsync everysec
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - data

networks:
  data:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-channel-data:
  postgres-stream-data:
  postgres-payment-data:
  postgres-vod-data:
  postgres-notification-data:
  mongodb-data:
  mongodb-config:
  redis-data:
  kafka-data:

configs:
  mongodb-init:
    content: |
      const chatPassword = process.env.CHAT_DB_PASSWORD;

      if (!chatPassword) {
        throw new Error('CHAT_DB_PASSWORD is required to initialize the chat database.');
      }

      const chatDatabase = db.getSiblingDB('reallive_chat');

      chatDatabase.createUser({
        user: 'chat_service',
        pwd: chatPassword,
        roles: [{ role: 'readWrite', db: 'reallive_chat' }],
      });
