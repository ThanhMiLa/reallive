spring:
  datasource:
    url: jdbc:h2:mem:login;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

jwt:
  signer-key: 1234567890123456789012345678901234567890123456789012345678901234
  ttl_accessToken: 900
  ttl_refreshToken: 2592000

storage:
  r2:
    bucket-name: test-avatars
    public-base-url: https://images.example.com
    endpoint: https://r2.example.invalid
    access-key-id: test-access-key
    secret-access-key: test-secret-key

auth:
  cookie:
    access-token:
      name: access_token
      max-age: ${jwt.ttl_accessToken}
      secure: false
      http-only: true
      same-site: Lax
      path: /
    refresh-token:
      name: refresh_token
      max-age: ${jwt.ttl_refreshToken}
      secure: false
      http-only: true
      same-site: Lax
      path: /api/auth
    reset-token:
      name: reset_token
      max-age: 600
      secure: false
      http-only: true
      same-site: Lax
      path: /api/auth/reset-password
  cors:
    allowed-origins: http://localhost:5173
