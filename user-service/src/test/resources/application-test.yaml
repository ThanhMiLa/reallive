spring:
  datasource:
    url: jdbc:h2:mem:login;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

jwt:
  signer-key: 1234567890123456789012345678901234567890123456789012345678901234
  ttl_accessToken: 900
  ttl_refreshToken: 2592000

auth:
  cookie:
    access-token:
      name: access_token
      max-age: ${jwt.ttl_accessToken}
      secure: false
      http-only: true
      same-site: Lax
      path: /
    refresh-token:
      name: refresh_token
      max-age: ${jwt.ttl_refreshToken}
      secure: false
      http-only: true
      same-site: Lax
      path: /api/auth
  cors:
    allowed-origins: http://localhost:5173

