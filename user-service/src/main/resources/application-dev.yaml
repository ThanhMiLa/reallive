server:
  port: 8080
  servlet:
    context-path: /user

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: user-service
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 5000
        delivery.timeout.ms: 15000
        max.block.ms: 5000
        retry.backoff.ms: 500

  application:
    name: user-service

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/reallive_user}
    username: ${USER_DB_USERNAME:user_service}
    password: ${USER_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

email-verification:
  topic: ${EMAIL_VERIFICATION_TOPIC:notification.email-verification.requested.v1}
  otp:
    ttl-seconds: ${OTP_COOLDOWN_SECONDS:60}
    hmac-key: ${OTP_HMAC_KEY:}

storage:
  r2:
    bucket-name: ${BUCKET_NAME}
    public-base-url: ${PUBLIC_BASE_URL}
    endpoint: ${R2_ENDPOINT}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  ttl_accessToken: ${AUTH_ACCESS_TOKEN_TTL:900}
  ttl_refreshToken: ${AUTH_REFRESH_TOKEN_TTL:2592000}

auth:
  cookie:
    access-token:
      name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}
      max-age: ${jwt.ttl_accessToken}
      secure: ${ACCESS_TOKEN_SECURE:false}
      http-only: ${ACCESS_TOKEN_HTTP_ONLY:true}
      same-site: ${ACCESS_TOKEN_SAME_SITE:Lax}
      path: ${ACCESS_TOKEN_PATH:/}
    refresh-token:
      name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
      max-age: ${jwt.ttl_refreshToken}
      secure: ${REFRESH_TOKEN_SECURE:false}
      http-only: ${REFRESH_TOKEN_HTTP_ONLY:true}
      same-site: ${REFRESH_TOKEN_SAME_SITE:Lax}
      path: ${REFRESH_TOKEN_PATH:/user/api/auth}
