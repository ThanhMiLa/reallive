server:
  port: 8080

spring:
  application:
    name: user-service

  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/reallive_user}
    username: ${USER_DB_USERNAME:user_service}
    password: ${USER_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  signer-key: ${JWT_SIGNER_KEY}
  ttl_accessToken: ${AUTH_ACCESS_TOKEN_TTL:900}
  ttl_refreshToken: ${AUTH_REFRESH_TOKEN_TTL:2592000}

auth:
  cookie:
    access-token:
      name: ${ACCESS_TOKEN_COOKIE_NAME:access_token}
      max-age: ${ACCESS_TOKEN_MAX_AGE:86400}
      secure: ${ACCESS_TOKEN_SECURE:false}
      http-only: ${ACCESS_TOKEN_HTTP_ONLY:true}
      same-site: ${ACCESS_TOKEN_SAME_SITE:Lax}
      path: ${ACCESS_TOKEN_PATH:/}
    refresh-token:
      name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
      max-age: ${REFRESH_TOKEN_MAX_AGE:86400}
      secure: ${REFRESH_TOKEN_SECURE:false}
      http-only: ${REFRESH_TOKEN_HTTP_ONLY:true}
      same-site: ${REFRESH_TOKEN_SAME_SITE:Lax}
      path: ${REFRESH_TOKEN_PATH:/api/auth}

app:
  cors:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173}
